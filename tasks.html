<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a20">
<link rel="icon" href="./icon-192.png">
<title>FREAK — משימות ספקים</title>
<style>
  :root{
    --bg:#0f1a20; --surface:#16262e; --surface2:#1d323c; --line:#2a4450;
    --teal:#3d7a94; --teal-hi:#5aa3c2; --green:#2E7D32; --green-hi:#43a047; --amber:#c77f14;
    --red:#c0392b; --red-soft:#3a1512; --ink:#e8eef1; --dim:#8fa6b0; --mono:'Roboto Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink)}
  body{font-family:-apple-system,'Segoe UI',Roboto,'Heebo',Arial,sans-serif; font-size:16px; line-height:1.4; padding-bottom:40px}
  button{font-family:inherit; font-size:15px; border:none; border-radius:10px; cursor:pointer; color:var(--ink); background:var(--surface2); padding:10px 12px; min-height:40px}
  button:disabled{opacity:.45; cursor:default}
  input,select{font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:10px; width:100%}
  input:focus,select:focus{outline:2px solid var(--teal)}
  a{color:var(--teal-hi)}
  .hide{display:none !important}

  #top{position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--line)}
  #topline{display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; padding:9px 12px; max-width:1180px; margin:0 auto}
  #topline > *{min-width:0}
  #dot{width:10px; height:10px; border-radius:50%; background:var(--red); flex:none}
  #dot.on{background:var(--green-hi)}
  #title{font-weight:700; font-size:16px}
  #ver{font-size:11px; color:var(--dim)}
  #topcnt{font-family:var(--mono); font-size:14px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:2px 10px}
  #upd{margin-inline-start:auto; font-size:12px; color:var(--dim); text-align:end}
  #upd.stale{color:#ffd479}
  #upd .sep{display:none}
  #queueBadge{background:var(--amber); color:#000; font-size:12px; font-weight:700; border-radius:9px; padding:2px 8px}
  #refreshBtn{padding:7px 11px; font-size:15px; min-height:36px}
  .olink{display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:0 12px; border:1px solid var(--teal); border-radius:10px; color:#c9e6f2; text-decoration:none; font-size:14px; font-weight:600; white-space:nowrap}

  #layout{max-width:640px; margin:0 auto; padding:0 12px}
  .banner{border-radius:12px; padding:10px 12px; font-size:14px; margin:10px 0}
  .banner.red{background:var(--red-soft); color:#f0b4ac; border:1px solid var(--red)}
  .banner.amber{background:#3a2c10; color:#ffd479; border:1px solid #5a4418}
  .banner.info{background:#10303a; color:#9fd8ea; border:1px solid #1f5a6a}
  .banner b{color:var(--ink)}
  .banner .row{margin-top:8px}

  /* filters: the kind chips always; the rest behind one "סינון" toggle on a phone, always open on a wide screen (as the order pages) */
  #kinds{display:flex; gap:6px; overflow-x:auto; padding:10px 0 4px; scrollbar-width:none}
  #kinds::-webkit-scrollbar{display:none}
  .chip{flex:none; background:var(--surface2); border:1px solid var(--line); border-radius:18px; padding:8px 13px; font-size:14px; white-space:nowrap; min-height:40px}
  .chip.on{background:var(--teal); border-color:var(--teal)}
  .chip .n{font-family:var(--mono); font-size:12px; margin-inline-start:6px; opacity:.85}
  .chip.tog{border-color:var(--teal-hi)}
  .chip.act{background:#2a4450; border-color:var(--teal-hi)}
  .chip.act .x{margin-inline-start:6px; opacity:.85; font-weight:700}
  #fbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0 2px}
  #fpanel{border:1px solid var(--line); border-radius:12px; padding:6px 10px 10px; margin:6px 0; background:var(--surface)}
  #fpanel .flbl{font-size:13px; font-weight:600; color:#c9d6dc; margin:8px 0 4px}
  #fpanel .chips{display:flex; flex-wrap:wrap; gap:6px}
  #q{padding:8px 10px; font-size:15px}
  #cnt{font-size:13px; color:var(--dim); margin:8px 2px 2px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  #cnt button{background:none; border:1px solid var(--line); color:#ffd479; padding:6px 10px; font-size:13px; min-height:36px}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin:8px 0}
  .card.pend{opacity:.6}
  .card.urgent{border-inline-start:4px solid var(--red)}
  .card .kind{display:inline-block; font-size:11px; color:#c9e6f2; border:1px solid var(--line); border-radius:10px; padding:1px 8px; margin-bottom:6px}
  .card .nm{font-size:16px; font-weight:700}
  .card .cd{font-family:var(--mono); font-size:12px; color:var(--dim); margin-inline-start:6px; font-weight:400}
  .meta{display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--dim); font-size:13px; margin-top:4px}
  .meta b{color:var(--ink); font-family:var(--mono); font-weight:600}
  .rec{margin-top:8px; font-size:14px}
  .rec b{color:var(--teal-hi)}
  .warn{color:#ffb4a8; font-size:13px; margin-top:6px}
  .why{color:var(--dim); font-size:12px; margin-top:4px}
  .offers{width:100%; border-collapse:collapse; margin-top:8px; font-size:13px}
  .offers td{padding:4px 2px; border-top:1px solid var(--line)}
  .offers td.p{font-family:var(--mono); text-align:end}
  .acts{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
  .acts button{flex:1; min-width:92px; padding:10px 8px; font-size:14px}
  .acts .go{background:var(--green); font-weight:700}
  .acts .alt{background:var(--surface2); border:1px solid var(--teal)}
  .acts .no{background:none; border:1px solid var(--line); color:var(--dim)}
  .chipline{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px}
  .pendline{margin-top:8px; font-size:13px; color:#ffd479}
  .editor{margin-top:10px; background:var(--surface2); border-radius:12px; padding:10px}
  .editor label{display:block; font-size:12px; color:var(--dim); margin:8px 0 4px}
  .editor .row{display:flex; gap:8px}
  .editor .row > *{flex:1}
  .opt{display:block; width:100%; text-align:start; margin-top:6px; background:var(--surface2); border:1px solid var(--line); padding:10px}
  .opt .s{font-size:12px; color:var(--dim)}
  .more{display:block; width:100%; margin:8px 0; background:none; border:1px dashed var(--line); color:var(--dim)}
  .empty{color:var(--dim); text-align:center; padding:30px 10px; font-size:15px}
  .cardlink{font-size:13px; margin-inline-start:8px}

  #toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:12px 18px; border-radius:12px; font-size:15px; font-weight:700;
         z-index:200; display:none; box-shadow:0 4px 20px rgba(0,0,0,.5); max-width:92vw; text-align:center; align-items:center; gap:12px}
  #toast.err{background:var(--red)} #toast.warn{background:var(--amber); color:#000}
  #toast button{background:rgba(0,0,0,.25); padding:6px 12px; font-size:14px; color:inherit}
  #gate{max-width:480px; margin:60px auto; padding:0 20px}
  #gate h1{color:var(--teal-hi); font-size:24px}
  #gate p{color:var(--dim); line-height:1.6}
  .bigbtn{width:100%; padding:14px; font-size:17px; font-weight:700; margin-top:10px}
  .bigbtn.go{background:var(--green)}
  #failedBox{background:var(--red-soft); border:1px solid var(--red); border-radius:10px; padding:10px; font-size:13px; margin:10px 0; color:#f0b4ac}
  #foot{color:var(--dim); font-size:12px; text-align:center; margin-top:24px}

  /* a phone: nothing in the top bar may be wider than the screen (a wider bar makes the whole page zoom out) */
  @media (max-width:600px){
    #ver,#upd br{display:none}
    #upd .sep{display:inline}
    #upd{font-size:11px}
    #ordersLink .lbl{display:none}
    #ordersLink{padding:0 10px}
  }
  /* a wide screen (his PC): the filters always open at the side, the cards in two columns */
  @media (min-width:1000px){
    #layout{max-width:1180px; display:grid; grid-template-columns:300px 1fr; gap:0 18px; align-items:start}
    #side{position:sticky; top:58px}
    #fbtn{display:none}
    #fpanel{display:block !important}
    #kinds{flex-wrap:wrap; overflow:visible}
    #list{display:grid; grid-template-columns:1fr 1fr; gap:0 12px; align-items:start}
    #list .more,#list .empty{grid-column:1 / -1}
  }
</style>
</head>
<body>
<div id="gate" class="hide">
  <h1>משימות ספקים</h1>
  <p id="gateSign" class="hide"></p>
  <p>כדי להיכנס צריך את המפתח האישי שלך. הוא נשמר בטלפון הזה בלבד. אם כבר נכנסת לדף הספקים בטלפון הזה, אין צורך בכלום: המפתח שם.</p>
  <input id="keyIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="מפתח">
  <button id="keyBtn" class="bigbtn go">שמור והמשך</button>
  <p id="gateMsg"></p>
  <p id="gateLine">מנהלים נכנסים דרך <a id="gateApp" href="#">FREAK צוות</a>.</p>
</div>

<div id="app" class="hide">
  <div id="top">
    <div id="topline">
      <span id="dot"></span><span id="title">משימות ספקים</span><span id="topcnt">0</span><span id="ver"></span>
      <span id="queueBadge" class="hide">0</span>
      <span id="upd"></span>
      <a id="ordersLink" class="olink" href="order.html" title="הזמנות מספקים">🛒<span class="lbl"> הזמנות מספקים</span></a>
      <button id="refreshBtn" title="רענון">⟳</button>
    </div>
  </div>
  <div id="layout">
    <div id="side">
      <div id="kinds"></div>
      <div id="fbar"></div>
      <div id="fpanel" class="hide"></div>
    </div>
    <div id="main">
      <div id="passMsg" class="hide"></div>
      <div id="banners"></div>
      <div id="failedBox" class="hide"></div>
      <div id="cnt"></div>
      <div id="list"></div>
      <div id="foot"></div>
    </div>
  </div>
</div>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo" class="hide">בטל</button></div>

<script>
'use strict';
/* ================= CONFIG ================= */
const BUILD = 't1.1';   // S-SUP step 2 (16/11/2026): ONE tasks screen for all suppliers, reading and answering through the same backend as suppliers.html; t1.1 (18/11): a manager signed in to the app FREAK צוות answers with a pass (no personal link, no key)
// the backend is the catalog's script, the same deployments as suppliers.html: LIVE reads the live list; ?api=test writes only the TEST copies;
// ?preview=1 = REAL rows, but every answer is only TRIED (dryRun: the server says what it would write and writes nothing). Never a URL from the address bar.
const LIVE_API = 'https://script.google.com/macros/s/AKfycbyCy0D7QPJNjpVIPP7NkNC38rkACV0t-O1C_m-SDsBUTFysG-Q0QUjtDPjI3Go8iYUZfw/exec';
const TEST_API = 'https://script.google.com/macros/s/AKfycbyzPhJi5UxWBqaJ7hlorCI-iiT_qprXfK8XHE3BHXWVGmNVrD7JWmMiiG5BldURbjPl8A/exec';
const QS = new URLSearchParams(location.search);
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const MODE = (()=>{ const a = QS.get('api'); return a==='test' ? 'test' : a==='local' && LOCAL ? 'local' : 'live'; })();
// t0.x: the LIVE page is ALWAYS preview. Real answers (the path that writes his typing, root rule 3) work only on the TEST deployment (?api=test&real=1, which writes only the
// private TEST copies) until the reviewer's open items, the TEST run and a second look are done; then the live flip is one reviewed commit.
// t1.1 (18/11/2026): PASSMODE = no saved key in this browser AND the app FREAK צוות is signed in here (its session id sits in localStorage). The page then asks the app's
// service for a short pass (5 min, audience freak-suppliers) and sends it as `p` instead of a key. The page never trusts that alone: real answers go out only while the
// backend's own list reply says role 'answerer' (roleBad() below), and the backend refuses everything outside the reply's allow-list.
// Chris's own key (a saved fs_key always wins) stays exactly as before: the LIVE page is preview, real answers only on TEST with &real=1.
// The session id and the pass are never written, removed, logged, put in a URL or kept in the queue.
const SID_RE = /^[A-Za-z0-9_-]{40,64}$/;
const APP_SID = 'freak_app_session', APP_MS = 30000;
const appSid = () => { try{ const s = JSON.parse(localStorage.getItem(APP_SID) || 'null'); return typeof s === 'string' && SID_RE.test(s) ? s : ''; }catch(e){ return ''; } };
const hasKey = () => { try{ return !!localStorage.getItem('fs_key') || /[#&]k=[\w\-]{20,100}/.test(location.hash); }catch(e){ return /[#&]k=[\w\-]{20,100}/.test(location.hash); } };
const SID = hasKey() ? '' : appSid();     // read once per load
const VIA = SID ? 'pass' : 'key';         // whose jobs this page sends: a job queued under a pass is never sent under a key, and the reverse
const PASSMODE = !!SID;
const PREVIEW = PASSMODE ? false : !(MODE === 'test' && QS.get('real') === '1');
const API = MODE==='test' ? TEST_API : MODE==='local' ? location.origin + '/api' : LIVE_API;
// the app FREAK צוות (public addresses, the same as board-page.js): its service per copy and the page to sign in on
const APP_API = MODE==='test' ? 'https://script.google.com/macros/s/AKfycbxs0ebx-l1Z-kjWriJb8itLkUvTz1cbmhiqkxdEKMUe9cOTls_RAe-veNmB0QtWINl-Dw/exec' : MODE==='local' ? location.origin + '/app' : 'https://script.google.com/macros/s/AKfycbyFl51NOb7BCmngZGamwe4Hn7xkoJjQBn9dvkBPswMOZa3yrPazmSYye3BDLEV5Xa7icA/exec';
const APP_PAGE = MODE==='live' ? 'https://epic-pita.github.io/freak-app/' : 'https://epic-pita.github.io/freak-app/t1/';
const ENV = MODE==='live' ? '' : 'test';
const TZ = 'Asia/Jerusalem';
const LS = { key: 'fs_key', data: 'fst_data_'+MODE, filters: 'fst_filters', os: 'fs_order_sups' };   // fs_key: the one key suppliers.html already keeps on this phone (same site)
const POLL_MS = 20000, UNDO_MS = 5000, PAGE = 10;
const KINDS = [['', 'הכול'], ['nosup', 'בלי ספק'], ['noprice', 'בלי מחיר'], ['out', 'אזל אצל הספק'], ['transit', 'בדרך']];
const KIND_HE = { nosup: 'בלי ספק', noprice: 'בלי מחיר', out: 'אזל אצל הספק', transit: 'בדרך' };
const COMMON_SUPS = ['Kaissa', 'ICO', 'Glassstaff', 'הקובייה', 'ACD', 'School market', 'VFI', 'PSI', 'Asmodee', 'סינאפסה', 'Breaking Games'];
const OS_URL = './order-suppliers.json';
// the role the backend reports for this key (in the list reply): 'answerer' = a limited key, with the exact list of answers it may give ('kind/answer').
// A key without a role (Chris's) may do everything the page offers. The page only HIDES what the key may not do; the backend is what refuses it.
const T_SIGNIN = 'כדי לענות על שאלות הספקים נכנסים ל-FREAK צוות עם חשבון הגוגל ואז חוזרים לכאן.';
const T_NOTALLOWED = 'שאלות הספקים פתוחות למנהלים בלבד.';
const T_RETRY = 'אין תשובה מ-FREAK צוות. לנסות שוב בעוד דקה.';
const T_BADPASS = 'הכניסה דרך FREAK צוות לא התקבלה. לסגור את הדף ולפתוח אותו שוב מהאפליקציה.';
const T_TOP = 'נכנסת דרך FREAK צוות. אפשר לענות על ספק, מוצר שאזל ומשלוחים.';
const ERR_HE = { ALREADY_ANSWERED: 'מישהו כבר ענה על זה. התשובה שלו נשמרה ושלך לא נשלחה.', NOT_ALLOWED: 'התשובה הזאת לא מותרת לך. אפשר לענות על: ספק, מוצר שאזל, משלוחים והערות', BAD_PASS: T_BADPASS };
const T_CHANGED = 'בגיליון כבר כתוב משהו אחר. לא דרסתי.';
const T_SAVED = 'נשמר';
const T_NONET = 'אין חיבור לשרת. לנסות שוב בעוד דקה.';
const GATE_BAD = 'המפתח לא מתאים. לפתוח שוב את הקישור האישי.';

/* ================= STATE ================= */
let KEY = '', data = null, query = '', shown = PAGE, openEditor = '', editorKind = '', panelOpen = false;
let F = { kind: '', sup: '', open: true };   // the filters, kept on this device
let pend = {};              // key → { ans, at } — answered on this phone, not yet seen in the list (kept in memory: a reload re-reads the truth)
let loading = false, lastOk = 0, db = null, syncing = false, loadAgain = false, orderSups = [];
const cancelled = new Set();
// PASSMODE: only what the reply's allow-list names is ever offered (no list = nothing); key mode as before
const ALLOW = () => PASSMODE ? new Set(data && Array.isArray(data.allow) ? data.allow : []) : (data && data.role === 'answerer' && Array.isArray(data.allow)) ? new Set(data.allow) : null;
const can = (kind, ans) => { const a = ALLOW(); return !a || a.has(kind + '/' + ans); };
// a signed-in app session whose list reply does not say role 'answerer' (or before the first list arrived): nothing real is sent
const roleBad = () => PASSMODE && !(data && data.role === 'answerer');

/* ================= UTIL ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}));
const ils = n => n==null||n==='' ? '' : '₪' + Number(n).toLocaleString('he-IL', {maximumFractionDigits: Number(n) < 100 ? 2 : 0});
const num = n => n==null||n==='' ? '—' : Number(n).toLocaleString('he-IL', {maximumFractionDigits:1});
// a number from the backend that goes into HTML: forced to a finite number first ('' when it is not one), never raw text (security review 16/11)
const ni = n => { const x = Number(n); return n == null || n === '' || !Number.isFinite(x) ? '' : String(Math.round(x * 10) / 10); };
const hhmm = iso => { const d=new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString('he-IL',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}); };
const ddmm = iso => { const d=new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('he-IL',{timeZone:TZ,day:'2-digit',month:'2-digit'}); };
function saveLS(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function loadLS(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function toast(msg, cls='', ms=2600, undo=null){
  const t=$('toast'); $('toastMsg').textContent=msg; t.className=cls; t.style.display='flex';
  const u=$('toastUndo'); u.classList.toggle('hide', !undo); u.onclick = undo ? ()=>{ undo(); t.style.display='none'; } : null;
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms);
}
function fetchT(url, opts, ms){ const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms); return fetch(url, {...opts, signal:c.signal}).finally(()=>clearTimeout(t)); }
async function postOnce(auth, body, ms){
  // Google sometimes turns the POST into a bare GET (doPost never runs; the backend answers GET_NOT_POST): the same request again
  for (let i = 0; ; i++){
    const r = await fetchT(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ ...auth, env: ENV || undefined, build: BUILD, ...body }) }, ms);
    const js = await r.json();
    if (!(js && js.error === 'GET_NOT_POST') || i >= 3) return js;
  }
}
/* the pass (PASSMODE): kept in memory only, reused while more than 60 s are left (it lives 5 min, so about one ask per 4 minutes) */
let PASS = '', PASS_EXP = 0, passAsk = null, passFailAt = 0, passFail = null, passDead = false, passStop = false;
const dropPass = () => { PASS = ''; PASS_EXP = 0; };
async function askApp(){
  for (let i = 0; ; i++){
    let js = null;
    try{ const r = await fetchT(APP_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ a:'pass', sid: SID, aud:'freak-suppliers' }) }, APP_MS); js = await r.json(); }catch(e){ return null; }
    if (!(js && (js.error === 'GET_NOT_POST' || js.code === 'GET_NOT_POST')) || i >= 2) return js;
  }
}
/** a usable pass { ok:true, pass } or { ok:false, code } (signed_out, not_active, not_allowed or retry) */
function getPass(fresh){
  if (!fresh && PASS && PASS_EXP - Date.now() > 60000) return Promise.resolve({ ok: true, pass: PASS });
  if (passStop) return Promise.resolve({ ok: false, code: 'not_allowed' });                            // the app said this person has no role: nothing more is asked
  if (passAsk) return passAsk;
  if (!fresh && passFail && Date.now() - passFailAt < 20000) return Promise.resolve(passFail);          // a failed ask is not repeated every few seconds
  passAsk = askApp().then(ans => {
    passAsk = null;
    if (ans && ans.ok === true && typeof ans.pass === 'string' && ans.pass){ PASS = ans.pass; PASS_EXP = Number(ans.exp) || 0; passFail = null; return { ok: true, pass: PASS }; }

  // answers still in the queue count as answered on this phone (a reopened app must not offer the same task again)
  if (db && !PREVIEW){ try{ for (const j of await qAll()) if (j.mode === MODE && mine(j) && !j.body.dryRun) pend[j.body.key] = { ans: j.body.answer, at: j.ts, uuid: j.uuid, label: '' }; }catch(e){} }
  badge(); sync(); load(!data);
  setInterval(() => { if (!document.hidden) load(false); }, POLL_MS);
}
$('gateApp').href = APP_PAGE;
takeKeyFromHash();
if (navigator.onLine) $('dot').classList.add('on');
start();
</script>
